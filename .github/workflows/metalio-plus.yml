name: Metalio Plus build

on:
  push:
    branches: [metalio-plus]
    paths:
      - "ports/metalio-plus/**"
      - "platformio.ini"
      - "freeink-sdk/**"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "scripts_local/**"
      - ".github/workflows/metalio-plus.yml"
  workflow_dispatch:

concurrency:
  group: metalio-plus-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the bootloader on the device. Do not change without a full reflash plan.
  IDF_COMMIT: 9a97f6c54ec638111ce55cd36581b3c192f15207
  IDF_PATH: ${{ github.workspace }}/esp-idf
  IDF_TOOLS_PATH: ${{ github.workspace }}/.espressif

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF and tools
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            esp-idf
            .espressif
          key: idf-${{ env.IDF_COMMIT }}-esp32s31-v1

      - name: Fetch ESP-IDF ${{ env.IDF_COMMIT }}
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git init esp-idf
          cd esp-idf
          git remote add origin https://github.com/espressif/esp-idf.git
          git fetch --depth 1 origin "$IDF_COMMIT"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Install ESP-IDF tools for esp32s31
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: ./esp-idf/install.sh esp32s31

      - name: Verify ESP-IDF revision
        run: python3 ports/metalio-plus/ci/check_idf.py --idf "$IDF_PATH"

      - name: Build smoke test
        working-directory: ports/metalio-plus/smoke
        run: |
          . "$IDF_PATH/export.sh"
          # esp32s31 is a preview target in IDF v6.1.
          idf.py --preview set-target esp32s31
          idf.py --preview build

      - name: Dump hardware config (smoke)
        run: |
          grep -E "^CONFIG_(SPIRAM|CACHE|CPU_FREQ|FLASHMODE|FLASHFREQ|ESPTOOLPY_FLASH|LCD_|XIP|FREERTOS_HZ|FREERTOS_UNICORE|COMPILER_OPTIM|MMU_PAGE|PSRAM|IRAM)" ports/metalio-plus/smoke/build/config/sdkconfig.h ports/metalio-plus/smoke/sdkconfig 2>/dev/null | sed 's/^/smoke: /' | sort -u | tee smoke-config.txt
      - name: Full config (smoke)
        if: always()
        run: grep -E "^#define CONFIG_" ports/metalio-plus/smoke/build/config/sdkconfig.h | sed 's/^/fullsmoke /' || true
      - name: Symbol placement (smoke)
        if: always()
        run: |
          . "$IDF_PATH/export.sh" >/dev/null 2>&1 || true
          nm=$(command -v riscv32-esp-elf-nm || true)
          [ -n "$nm" ] && "$nm" -S --defined-only ports/metalio-plus/smoke/build/CrossNext-Plus-Smoke.elf | grep -iE ' [tTdDbBrR] ' | grep -iE '(lut|lcd|render|line_queue|lq_|phase|epd_|feed|bounce|calc_|isr|eof|ricky|white_border|nibble|waveform)' | awk '{print "symsmoke", $4, $1, $2, $3}' | sort || true
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-config-${{ github.run_number }}
          path: smoke-config.txt
      - name: Verify image
        run: |
          python3 ports/metalio-plus/ci/check_idf.py --idf "$IDF_PATH" \
            --project-description ports/metalio-plus/smoke/build/project_description.json
          python3 ports/metalio-plus/ci/check_image.py ports/metalio-plus/smoke/build/CrossNext-Plus-Smoke.bin
          mkdir -p out
          cp ports/metalio-plus/smoke/build/CrossNext-Plus-Smoke.bin out/CrossNext-Plus-Smoke-app1.bin
          cp ports/metalio-plus/smoke/build/CrossNext-Plus-Smoke.elf out/
          cp ports/metalio-plus/flash/otadata-app1.bin ports/metalio-plus/flash/otadata-app0.bin out/
          sha256sum out/*.bin | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CrossNext-Plus-Smoke-${{ github.run_number }}
          path: out/

  # CrossNext for the Metalio Plus (pioarduino develop, Arduino 4.0.0, IDF v6.1.1).
  crossnext:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO (pioarduino core)
        run: pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.post1.zip
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-plus-${{ hashFiles('platformio.ini') }}
      - name: Build metalio_plus
        env:
          SCONSFLAGS: -k
        run: pio run -e metalio_plus 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Full config (crossnext)
        if: always()
        run: grep -E "^#define CONFIG_" ~/.platformio/packages/framework-arduinoespressif32-libs/esp32s31/dio_opi/include/sdkconfig.h | sed 's/^/fullcn /' || true
      - name: Compile flags (crossnext)
        if: always()
        run: |
          for f in ~/.platformio/packages/framework-arduinoespressif32-libs/esp32s31/flags/*; do echo "flags $(basename $f): $(cat $f)"; done || true
      - name: Symbol placement (crossnext)
        if: always()
        run: |
          nm=$(find ~/.platformio/packages -name riscv32-esp-elf-nm -type f 2>/dev/null | head -1); echo "nm=$nm"
          [ -n "$nm" ] && "$nm" -S --defined-only .pio/build/metalio_plus/firmware.elf | grep -iE ' [tTdDbBrR] ' | grep -iE '(lut|lcd|render|line_queue|lq_|phase|epd_|feed|bounce|calc_|isr|eof|ricky|white_border|nibble|waveform)' | awk '{print "symcn", $4, $1, $2, $3}' | sort || true
      - name: Dump hardware config (crossnext)
        if: always()
        run: |
          files=$(find . ~/.platformio/packages -path '*esp32s31*' \( -name sdkconfig -o -name sdkconfig.h \) 2>/dev/null; ls sdkconfig.metalio_plus 2>/dev/null || true)
          echo "config files: $files"
          for f in $files; do
            [ -f "$f" ] && grep -E "^(#define )?CONFIG_(SPIRAM|CACHE|CPU_FREQ|FLASHMODE|FLASHFREQ|ESPTOOLPY_FLASH|LCD_|XIP|FREERTOS_HZ|FREERTOS_UNICORE|COMPILER_OPTIM|MMU_PAGE|PSRAM|IRAM)" "$f" | sed "s|^|crossnext($f): |" || true
          done | sort -u
      - name: Verify image
        run: |
          python3 ports/metalio-plus/ci/check_image.py .pio/build/metalio_plus/firmware.bin
          mkdir -p out
          cp .pio/build/metalio_plus/firmware.bin out/CrossNext-Plus-app1.bin
          cp ports/metalio-plus/flash/otadata-app1.bin ports/metalio-plus/flash/otadata-app0.bin out/
          cp .pio/build/metalio_plus/partitions.bin out/partition-table-large-app1.bin
          sha256sum out/*.bin | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrossNext-Plus-${{ github.run_number }}
          path: out/
      # Debug symbols for decoding crash backtraces; kept out of the flash zip.
      - uses: actions/upload-artifact@v4
        with:
          name: CrossNext-Plus-${{ github.run_number }}-debug-elf
          path: .pio/build/metalio_plus/firmware.elf
